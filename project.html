<!doctype html>
<html lang="en" dir="ltr">
<head>
<script>try{const savedLang=localStorage.getItem('amur-lang')||'en';document.documentElement.lang=savedLang;document.documentElement.dir=savedLang==='ar'?'rtl':'ltr';document.documentElement.dataset.lang=savedLang;}catch(e){}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AMUR — Case Study</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Inter+Tight:wght@300;400;500;600&family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css?v=3701">
  <link rel="stylesheet" href="./css/project-final.css?v=3701">
  <link rel="stylesheet" href="./css/typography-v35.css?v=3701">
  <link rel="stylesheet" href="./css/project-v37.css?v=3701">

<style id="amur-project-final-v36">
:root{--amur-en:"Inter Tight","Manrope",Arial,sans-serif;--amur-ar:"IBM Plex Sans Arabic",Arial,sans-serif}
.single-project-experience-page.lang-en,.single-project-experience-page.lang-en *{font-family:var(--amur-en)}
.single-project-experience-page.lang-ar,.single-project-experience-page.lang-ar *{font-family:var(--amur-ar)}
.px-project-name,.px-grid-title,.px-products-grid-head h2,.px-exit h2{font-weight:300!important;letter-spacing:-.04em!important;text-transform:none!important}.lang-ar .px-project-name,.lang-ar .px-grid-title,.lang-ar .px-products-grid-head h2,.lang-ar .px-exit h2{font-weight:300!important;letter-spacing:-.02em!important}
.px-grid-title,.px-products-grid-head h2{font-size:clamp(38px,3vw,58px)!important;line-height:1.08!important}.px-grid-body,.px-products-grid-description{font-size:clamp(14px,1vw,17px)!important;line-height:1.85!important;font-weight:300!important;max-width:760px!important}.px-grid-kicker,.px-topline,.px-hint,.px-nav-meta,.project-back{font-size:11px!important;letter-spacing:.09em!important}.px-exit h2{font-size:clamp(42px,4vw,72px)!important;line-height:1.02!important}
@media(max-width:760px){.px-header .nav{padding:12px 16px!important;gap:10px!important}.px-nav-meta .nav-caption{display:none!important}.project-back{font-size:10px!important}.px-grid-title,.px-products-grid-head h2{font-size:clamp(30px,9vw,42px)!important}.px-grid-body,.px-products-grid-description{font-size:13px!important;line-height:1.75!important}.px-layout-grid{grid-template-columns:1fr!important;gap:22px!important}.px-grid-visual{min-width:0!important}.px-media-deck,.px-image{max-width:100%!important}.px-exit h2{font-size:clamp(34px,11vw,52px)!important}.px-product-grid-item{min-width:78vw!important}.px-products-grid-row{overflow-x:auto!important;scroll-snap-type:x mandatory!important;-webkit-overflow-scrolling:touch!important}.px-product-grid-item{scroll-snap-align:center!important}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>

<body class="single-project-experience-page">

<div class="site-bg" aria-hidden="true">
  <div class="ambient a1"></div>
  <div class="ambient a2"></div>
  <div class="mouse-field" id="mouseField"></div>
  <div class="bg-grid"></div>
  <div class="global-brush gb1"></div>
  <div class="global-brush gb2"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<header class="site-header px-header">
  <div class="shell nav">
    <a class="brand magnetic" href="./index.html">AMUR</a>
    <a class="project-back magnetic" href="./index.html#projectsGrid" onclick="window.location.href=\'./index.html#projectsGrid\'; return false;">BACK TO WORK ↗</a>
    <div class="nav-meta px-nav-meta"><button class="lang-toggle magnetic" id="langToggle" type="button" aria-label="Switch language">AR</button><span class="nav-caption">CASE STUDY</span></div>
  </div>
</header>

<main class="px-main">

  <section class="px-experience" id="projectExperience">
    <div class="px-sticky">

      <div class="px-world" aria-hidden="true">
        <div class="px-cover" id="pxCover"></div>
        <div class="px-world-dark"></div>
        <div class="px-spotlight"></div>
        <div class="px-rim"></div>
        <div class="px-chess-floor"></div>
        <div class="px-lines"></div>
        <div class="px-dust d1"></div>
        <div class="px-dust d2"></div>
      </div>

      <div class="px-shell shell">
        <div class="px-topline">
          <span id="pxCategory">AMUR / PROJECT</span>
          <b id="pxCounter">01 / 01</b>
        </div>

        <div class="px-progress" aria-hidden="true">
          <i id="pxProgressFill"></i>
        </div>

        <div class="px-stage" id="pxStage"></div>

        <div class="px-hint">
          <span>SCROLL TO EXPLORE</span>
          <i></i>
        </div>
      </div>

    </div>
  </section>

  <section class="px-exit">
    <div class="shell">
      <span id="projectExitLabel">END OF PROJECT</span>
      <h2 id="projectExitTitle">FROM IDEA<br>TO OPERATION.</h2>
      <a class="line-link magnetic" id="projectExitBack" href="./index.html#projectsGrid">BACK TO ALL WORK ↗</a>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/config.js"></script>
<script src="./js/i18n-core.js?v=3701"></script>
<script src="./js/project.js?v=3701"></script>




<script>
document.addEventListener("click", function(e){
  const a = e.target.closest("a");
  if(!a) return;
  if(a.matches(".project-back") || a.id === "projectExitBack"){
    e.preventDefault();
    window.location.assign("./index.html#projectsGrid");
  }
});
</script>

</body>
</html>
