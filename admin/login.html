<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل دخول أمور</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#f4f0e8;font-family:Arial,"Noto Kufi Arabic",sans-serif}
    .card{width:min(430px,calc(100% - 28px));padding:30px;border:1px solid #292929;border-radius:18px;background:#0d0d0d;box-shadow:0 30px 90px rgba(0,0,0,.35)}
    h1{margin:0 0 8px;font-size:30px}.sub{color:#777;font-size:12px;line-height:1.7;margin-bottom:22px}
    label{display:block;color:#aaa;font-size:12px;margin:12px 0 6px}
    input{width:100%;padding:13px;background:#121212;color:#fff;border:1px solid #303030;border-radius:10px;outline:none}
    button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#f2eee6;color:#111;font-weight:800;cursor:pointer}
    #s{min-height:22px;color:#e38e8e;font-size:12px;margin:12px 0 0}
  </style>
</head>
<body>
  <main class="card">
    <h1>لوحة تحكم أمور</h1>
    <p class="sub">سجّل دخولك لإدارة المشاريع والمحتوى والمنتجات.</p>
    <form id="f">
      <label for="e">البريد الإلكتروني</label>
      <input id="e" type="email" autocomplete="email" required>
      <label for="p">كلمة المرور</label>
      <input id="p" type="password" autocomplete="current-password" required>
      <button type="submit">تسجيل الدخول</button>
      <p id="s"></p>
    </form>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script>
const f=document.getElementById("f"),s=document.getElementById("s"),e=document.getElementById("e"),p=document.getElementById("p");
f.addEventListener("submit",async ev=>{
  ev.preventDefault();s.textContent="جاري تسجيل الدخول...";
  try{
    const c=window.AMUR_CONFIG||{};
    const sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);
    const {error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});
    if(error){s.textContent="تعذر تسجيل الدخول: "+error.message;return}
    location.href="index.html";
  }catch(err){s.textContent="حدث خطأ في الاتصال. جرّب مرة تانية."}
});
</script>
</body>
</html>
